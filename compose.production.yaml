services:
  api:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
  migrate:
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
  web:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx-common.conf:/etc/nginx/snippets/kids-common.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
