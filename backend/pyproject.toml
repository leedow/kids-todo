[project]
name = "kids-todo-api"
version = "0.1.0"
description = "儿童任务与卡片收集应用"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23.1,<26",
  "pillow>=11.1,<13",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"**/scripts/*.py" = ["E402"]
