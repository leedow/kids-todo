name: kids-todo

x-api: &api
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://kids:${POSTGRES_PASSWORD:?请在.env设置POSTGRES_PASSWORD}@db:5432/kidstodo
    SECRET_KEY: ${SECRET_KEY:?请在.env设置SECRET_KEY}
    APP_ENV: ${APP_ENV:-development}
    APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    MEDIA_ROOT: /app/data/media
  volumes:
    - media:/app/data/media

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: kids
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env设置POSTGRES_PASSWORD}
      POSTGRES_DB: kidstodo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kids -d kidstodo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  test-db:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_USER: kids
      POSTGRES_PASSWORD: kids
      POSTGRES_DB: kidstodo_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kids -d kidstodo_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  media:
